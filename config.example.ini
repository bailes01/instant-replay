# InstantReplay Configuration (Template)
# Copy to config.ini or run InstantReplay.exe to generate config.ini automatically.

[capture]
monitor_index = 0
fps = 60
replay_seconds = 30
output_dir = captures/
hotkey = Alt+F10

[video]
codec = av1
bitrate_kbps = 16000
preset = 5

[debug]
debug_bitrate_sweep = false
sweep_bitrates_kbps = 4000, 8000, 14000, 24000

[audio]
audio_mode = active_window
audio_bitrate_kbps = 160

[upload]
username = player1
auto_upload = false
upload_url = http://localhost:8080/api/upload
upload_token = change-me-in-config
copy_link_to_clipboard = true
