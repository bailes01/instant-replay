# InstantReplay Configuration (Template)
# Copy to config.ini or run InstantReplay.exe to generate config.ini automatically.

[capture]
monitor_index = 0
fps = 60
replay_seconds = 30
output_dir = captures/
hotkey = Alt+F10

[video]
codec = av1
bitrate_kbps = 16000
preset = 5

[debug]
debug_bitrate_sweep = false
sweep_bitrates_kbps = 4000, 8000, 14000, 24000

[audio]
audio_mode = active_window
audio_bitrate_kbps = 160

[upload]
username = player1
# user_token is auto-generated on first launch and bound to your username
user_token = 
auto_upload = false
delete_after_upload = false
server_url = http://localhost:8080
upload_token = 
copy_link_to_clipboard = true
